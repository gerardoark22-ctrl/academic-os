# Render — Academic OS (Starter + disco persistente)
# Costo aprox: $7/mes (Starter) + $0.25/mes (1 GB disco) = ~$7.25/mes

services:
  - type: web
    name: academic-os
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ACADEMIC_OS_DATA
        value: /var/data
      - key: ACADEMIC_OS_CLOUD
        value: "1"
      - key: DEEPSEEK_API_KEY
        sync: false
    disk:
      name: academic-data
      mountPath: /var/data
      sizeGB: 1
